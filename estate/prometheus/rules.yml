groups:
- name: demo_alerts
  rules:
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[1m]) > 0.05
    for: 1m
    labels:
      severity: page
    annotations:
      summary: High error rate on {{ $labels.instance }}

  - alert: HighLatency
    expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1.0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: High latency on {{ $labels.instance }}

  - alert: FrontendDown
    expr: probe_success{job="blackbox"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Frontend is down (synthetic check)

  - alert: HighDiskUsage
    expr: (node_filesystem_size_bytes{mountpoint="/valkey-data"} - node_filesystem_free_bytes{mountpoint="/valkey-data"}) / node_filesystem_size_bytes{mountpoint="/valkey-data"} > 0.85
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: High disk usage on {{ $labels.instance }} volume {{ $labels.mountpoint }}

  - alert: HighMemoryUsage
    expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) > 0.85
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: High memory usage on {{ $labels.name }}

  - alert: ContainerRestarted
    expr: changes(container_start_time_seconds[5m]) > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Container {{ $labels.name }} has restarted
