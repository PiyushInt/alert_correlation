[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace"
version = "0.1.0"
description = "Alert Correlation Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.112.0",
    "uvicorn>=0.30.5",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "alembic>=1.13.2",
    "networkx>=3.3",
    "xxhash>=3.4.1",
    "datasketch>=1.6.4",
    "mlxtend>=0.23.1",
    "pyroaring>=0.4.5",
    "rapidfuzz>=3.9.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "hypothesis>=6.111.1",
    "ruff>=0.6.1",
    "mypy>=1.11.1",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
